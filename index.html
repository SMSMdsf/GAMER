<!-- Full-screen overlay container for the video -->
<div id="rickroll-container" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; z-index:999999;">
  <div id="player" style="width:100%; height:100%;"></div>
</div>

<script>
  (function() {
    let triggered = false;

    // 1. Intercept the player's interaction
    function triggerPrank(e) {
      if (triggered) return;
      triggered = true;

      e.preventDefault();
      e.stopPropagation();

      // Show the hidden full-screen container
      document.getElementById('rickroll-container').style.display = 'block';
      
      // Load the YouTube Iframe API dynamically
      let tag = document.createElement('script');
      tag.src = "https://youtube.com";
      let firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    window.addEventListener('keydown', triggerPrank, true);
    window.addEventListener('mousedown', triggerPrank, true);
    window.addEventListener('pointerdown', triggerPrank, true);
    window.addEventListener('touchstart', triggerPrank, true);

    // 2. This function automatically runs when the API loads
    window.onYouTubeIframeAPIReady = function() {
      new YT.Player('player', {
        height: '100%',
        width: '100%',
        // Uses the privacy-enhanced ad-free endpoint
        host: 'https://youtube-nocookie.com', 
        videoId: 'dQw4w9WgXcQ',
        playerVars: {
          'autoplay': 1,
          'controls': 0,    // Hides pause, play, and progress bars
          'disablekb': 1,  // Disables spacebar to pause
          'modestbranding': 1, // Removes the large YouTube logo
          'rel': 0          // Prevents related videos at the end
        },
        events: {
          'onReady': function(event) {
            event.target.playVideo();
          }
        }
      });
    }
  })();
</script>
