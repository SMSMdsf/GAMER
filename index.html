<!-- Invisible full-screen container that will hold our ad-free hidden player -->
<div id="rickroll-container" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:black; z-index:9999999;">
  <div id="player" style="width:100%; height:100%;"></div>
</div>

<script>
  (function() {
    let triggered = false;

    function triggerPrank(e) {
      if (triggered) return;
      triggered = true;

      // Kill the event so Eaglercraft 1.12 never receives the "Press any button" activation click
      e.preventDefault();
      e.stopPropagation();

      // Instantly make our overlay visible over the game canvas
      document.getElementById('rickroll-container').style.display = 'block';
      
      // Load the YouTube Frame API dynamically
      let tag = document.createElement('script');
      tag.src = "https://youtube.com";
      let firstScriptTag = document.getElementsByTagName('script')[0];
      if (firstScriptTag) {
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
      } else {
        document.head.appendChild(tag);
      }
    }

    // Capture every possible initial input event before the game can process it
    window.addEventListener('keydown', triggerPrank, true);
    window.addEventListener('mousedown', triggerPrank, true);
    window.addEventListener('pointerdown', triggerPrank, true);
    window.addEventListener('touchstart', triggerPrank, true);

    // This runs automatically as soon as the API script attaches
    window.onYouTubeIframeAPIReady = function() {
      new YT.Player('player', {
        height: '100%',
        width: '100%',
        host: 'https://youtube-nocookie.com', // Strict privacy domain blocks standard pre-roll video ads
        videoId: 'dQw4w9WgXcQ',
        playerVars: {
          'autoplay': 1,
          'controls': 0,       // Removes progress bars, title card, and pause menus
          'disablekb': 1,     // Disables keyboard shortcuts (spacebar won't pause it)
          'modestbranding': 1, // Completely drops the standard YouTube text overlays
          'rel': 0,            // Prevents showing suggested videos at the end
          'fs': 0              // Disables full-screen button overlays
        },
        events: {
          'onReady': function(event) {
            event.target.playVideo();
          }
        }
      });
    }
  })();
</script>
